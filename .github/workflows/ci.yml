name: ci

# Test gate only. Deployment is done by Fly.io's GitHub integration, which builds the
# committed Dockerfile and rolls the machine on every push to main (ADR-004). Keeping
# one deploy path means no Fly token in GitHub and no second definition of "deploy".
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt mypy
      - run: ruff check . && ruff format --check src tests evals
      - run: mypy src
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: ui
      - run: docker build -t recipe-rag .
