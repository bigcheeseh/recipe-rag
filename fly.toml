# fly.toml app configuration file generated for recipe-rag on 2026-09-05T15:22:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'recipe-rag'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  CORPUS_PATH = 'data/corpus.json'
  MODEL = 'claude-sonnet-5'
  PORT = '8080'
  RETRIEVER = 'full'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
