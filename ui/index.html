<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Q&A</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; }
    input { flex: 1 1 20rem; padding: .5rem; font: inherit; }
    button { padding: .5rem 1rem; font: inherit; }
    #switches { display: flex; gap: 1rem; flex-wrap: wrap; margin: .75rem 0; font-size: .875rem; color: #444; }
    #switches label { display: flex; gap: .4rem; align-items: center; }
    #switches select { font: inherit; }
    #switches small { color: #666; cursor: help; border-bottom: 1px dotted #999; }
    #refusal { border-left: 4px solid #c33; padding-left: .75rem; }
    #answer { white-space: pre-wrap; }
    #meta { color: #666; font-size: .875rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Recipe Q&A</h1>
  <p>Answers come only from 48 Wikibooks Cookbook recipes. Anything else is refused.</p>
  <form id="ask">
    <input id="question" name="question" maxlength="500" placeholder="How many eggs go into carbonara?" required autofocus>
    <button id="submit" type="submit">Ask</button>
  </form>
  <div id="switches" hidden>
    <label>Model <select id="model"></select> <small id="model-note" title="">?</small></label>
    <label>Retrieval <select id="retriever"></select> <small id="retriever-note" title="">?</small></label>
  </div>
  <section id="result" hidden>
    <p id="refusal" hidden></p>
    <p id="answer"></p>
    <ul id="conflicts"></ul>
    <h2>Citations</h2>
    <ul id="citations"></ul>
    <p id="meta"></p>
  </section>
  <p id="error" hidden></p>
  <script src="main.js"></script>
</body>
</html>
